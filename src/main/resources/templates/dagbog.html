<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simpl – Dagbog</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
    <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
    <link rel="stylesheet" href="/css/pages.css">      <!-- css til de enkelte sider -->

    <!-- defer: scripts kører først, når HTML'en er læst. common.js skal komme først -->
    <script src="/js/common.js" defer></script>
    <script src="/js/dagbog.js" defer></script>
</head>
<body class="dashboard">

<nav th:replace="~{fragments/menu :: menu('dagbog')}"></nav>

<main class="content">

    <header th:replace="~{fragments/topbar :: topbar('Dagbog')}"></header>

    <div th:replace="~{fragments/besked :: besked}"></div>

    <!-- kortene står i to kolonner -->
    <div class="form-layout">

        <!-- venstre: formular -->
        <section class="card form-card" aria-labelledby="note-title">
            <h2 id="note-title">Skriv dagens note</h2>
            <p class="subtitle">Kun til dig. Du kan altid slette den igen.</p>

            <form action="/dagbog" method="post">
                <label for="date">Dato</label>
                <input type="date" id="date" name="date" required>

                <!-- title er NOT NULL i diary_entry -->
                <label for="title">Titel</label>
                <input type="text" id="title" name="title" placeholder="Fx Scanning i dag" maxlength="100" required>

                <label for="note">Note</label>
                <textarea id="note" name="note" rows="6" placeholder="Hvordan har dagen været?" required></textarea>

                <button type="submit">Gem note</button>
            </form>

            <p class="link-line"><a href="/dashboard">Annullér</a></p>
        </section>

        <!-- højre: tidligere noter -->
        <aside class="card helpbox" aria-labelledby="notes-title">
            <h2 id="notes-title" class="eyebrow">Tidligere noter</h2>
            <ul class="notes">
                <li th:each="e : ${entries}">
                    <strong>
                        <span th:text="${#temporals.format(e.dateTime, 'd. MMM yyyy')}">I dag</span> ·
                        <span th:text="${e.title}">Scanning</span>
                    </strong>
                    <span th:text="${e.content}">Lidt træt efter scanningen, men det ser fint ud.</span>
                    <form action="/dagbog/slet" method="post" class="delete-form">
                        <input type="hidden" name="id" th:value="${e.id}">
                        <button type="submit" class="muted-link" th:attr="aria-label='Slet note ' + ${e.title}">Slet</button>
                    </form>
                </li>
            </ul>
            <p class="muted">
                <span th:text="${entries.size()}">7</span>
                <span th:text="${entries.size() == 1} ? 'note' : 'noter'">noter</span>.
            </p>
        </aside>

    </div>

</main>

</body>
</html>
