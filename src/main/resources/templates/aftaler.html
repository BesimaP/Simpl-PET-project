<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Aftaler</title>

  <!-- skrifttyper og vores css filer -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->

  <!-- javascript: defer = vent med at køre til hele siden er læst. common.js først, så sidens egen fil -->
  <script src="/js/common.js" defer></script>
  <script src="/js/aftaler.js" defer></script>
</head>
<body class="dashboard">

<!-- menuen hentes fra fragments/menu.html – 'aftaler' = det menupunkt, der lyser op -->
<nav th:replace="~{fragments/menu :: menu('aftaler')}"></nav>

  <!-- selve siden -->
  <main class="content">

    <!-- overskrift + klokke og avatar øverst -->
    <header class="topbar">
      <div>
        <h1>Aftaler</h1>
      </div>
      <div class="topbar__actions">
        <a href="/notifikationer" class="iconbtn" aria-label="Notifikationer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
          <!-- th:if: rød prik ved ulæste påmindelser. ${unread} sættes for alle sider i RouteConfig (before-handler) -->
          <span class="dot" th:if="${unread != null and unread > 0}"></span>
        </a>
        <a href="/min-profil" class="avatar desktop-only" aria-label="Min profil"
           th:text="${#strings.toUpperCase(#strings.substring(session.patientName, 0, 1))}">A</a>
      </div>
    </header>

    <!-- besked fra controlleren: "Gemt ✓" eller en fejl. Fragmentet ligger i templates/fragments/besked.html -->
    <div th:replace="~{fragments/besked :: besked}"></div>

    <!-- INDHOLD: byg videre her (se tegningen i simpl-sider-plan.html) -->

    <!-- form-layout gør at kortene står i 2 kolonner (samme som hormoner.html) -->
    <div class="form-layout">

      <!-- VENSTRE: formular til at oprette en aftale -->
      <section class="card form-card" aria-labelledby="aftale-title">
        <h2 id="aftale-title">Ny aftale</h2>
        <p class="subtitle">Skriv aftalen ind, så den dukker op i din oversigt.</p>

        <!-- action = ruten POST /aftaler i AppointmentController -->
        <form action="/aftaler" method="post">
          <!-- value = det navn databasen bruger (tabellen appointment_type i schema_postgres.sql), teksten er den danske visning -->
          <label for="type">Type</label>
          <select id="type" name="type" required>
            <option value="">Vælg…</option>
            <option value="CONSULTATION">Konsultation</option>
            <option value="SCANNING">Scanning</option>
            <option value="BLOOD_TEST">Blodprøve</option>
            <option value="EGG_RETRIEVAL">Ægudtagning</option>
            <option value="EMBRYO_TRANSFER">Oplægning</option>
            <option value="PREGNANCY_TEST">Graviditetstest</option>
          </select>

          <!-- hedder location i databasen (appointment.location) -->
          <label for="location">Klinik</label>
          <input type="text" id="location" name="location" placeholder="Fx Vitanova" required>

          <!-- type date = kalender -->
          <label for="date">Dato</label>
          <input type="date" id="date" name="date" required>

          <label for="time">Klokkeslæt</label>
          <input type="time" id="time" name="time" required>

          <!-- note på aftalen er valgt fra (ingen kolonne i databasen) – står under "fremtidige features" -->

          <!-- knappen sender formularen -->
          <button type="submit">Gem aftale</button>
        </form>

        <p class="link-line"><a href="/dashboard">Annullér</a></p>
      </section>

      <!-- HØJRE: kommende og tidligere aftaler, som .rounds-underkort med datebox (samme mønster som rundehistorik/dashboard) -->
      <aside class="card helpbox" aria-labelledby="list-title">
        <h2 id="list-title" class="eyebrow">Kommende aftaler</h2>
        <!-- th:each: ét li per aftale. a = én aftale ad gangen. #temporals.format: dag, måned, klokkeslæt ud af dateTime -->
        <ul class="rounds">
          <li th:each="a : ${upcoming}">
            <div class="datebox">
              <strong th:text="${#temporals.day(a.dateTime)}">5</strong>
              <small th:text="${#temporals.format(a.dateTime, 'MMM')}">SEP</small>
            </div>
            <div class="round__info">
              <strong class="appt__title" th:text="${a.appointmentType.label}">Scanning</strong>
              <span th:text="${a.location} + ' · kl. ' + ${#temporals.format(a.dateTime, 'HH:mm')}">Vitanova · kl. 9.30</span>
            </div>
          </li>
        </ul>
        <!-- th:if: vises kun, når listen er tom -->
        <p class="muted" th:if="${upcoming.isEmpty()}">Ingen kommende aftaler.</p>

        <h2 class="eyebrow">Tidligere aftaler</h2>
        <ul class="rounds">
          <li th:each="a : ${past}">
            <div class="datebox">
              <strong th:text="${#temporals.day(a.dateTime)}">21</strong>
              <small th:text="${#temporals.format(a.dateTime, 'MMM')}">AUG</small>
            </div>
            <div class="round__info">
              <strong class="appt__title" th:text="${a.appointmentType.label}">Opstartssamtale</strong>
              <span th:text="${a.location} + ' · kl. ' + ${#temporals.format(a.dateTime, 'HH:mm')}">Vitanova · kl. 10.00</span>
            </div>
          </li>
        </ul>
        <p class="muted" th:if="${past.isEmpty()}">Ingen tidligere aftaler.</p>

      </aside>

    </div>
  </main>

</body>
</html>
