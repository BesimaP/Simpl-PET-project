<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<!--
  "Er du sikker?"-side (Nielsen #5). Bruges når JavaScript er slået fra, så dialogerne på dashboard
  og min-profil ikke kan åbne. Den samme side bruges til afslut runde, afslut forløb og slet konto,
  så teksterne kommer fra controlleren.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Simpl – ' + ${button}">Simpl – Bekræft</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/customStyle.css">
</head>
<body>

<div class="split">

    <section class="brand">
        <img src="/img/spire-ring.svg" alt="" width="104" height="104">
        <h1 class="wordmark">SIMPL</h1>
        <p class="tagline">Dit forløb, din vej</p>
    </section>

    <main class="form-area">
        <div class="card login-card">
            <h2 th:text="${title}">Afslut runde 2?</h2>
            <p class="subtitle" th:text="${text}">Runden markeres som afsluttet, og du kan starte en ny.</p>

            <!-- /afslut-runde, /afslut-forloeb eller /slet-konto -->
            <form th:action="${action}" method="post">

                <!-- kun ved afslut runde. Resultatet er valgfrit, tom værdi betyder ikke afgjort endnu -->
                <div th:if="${showResult}">
                    <label for="result">Resultat</label>
                    <select id="result" name="result">
                        <option value="">Ikke afgjort endnu</option>
                        <option th:each="r : ${results}" th:value="${r.name()}" th:text="${r.label}">Positiv</option>
                    </select>
                </div>

                <button type="submit" th:text="${button}">Afslut runde</button>
            </form>

            <!-- fortryd: tilbage uden at noget sker -->
            <p class="link-line"><a th:href="${cancel}">Annullér</a></p>
        </div>
    </main>

</div>

</body>
</html>
