<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Tidslinje</title>

  <!-- skrifttyper og vores css filer -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->
</head>
<body class="dashboard">

<!-- menuen hentes fra fragments/menu.html – 'tidslinje' = det menupunkt, der lyser op -->
<nav th:replace="~{fragments/menu :: menu('tidslinje')}"></nav>

<!-- selve siden -->
<main class="content">

  <!-- overskrift + klokke og avatar øverst -->
  <header class="topbar">
    <div>
      <h1>Tidslinje</h1>
    </div>
    <div class="topbar__actions">
      <a href="/notifikationer" class="iconbtn" aria-label="Notifikationer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <!-- th:if: rød prik ved ulæste påmindelser. ${unread} sættes for alle sider i RouteConfig (before-handler) -->
        <span class="dot" th:if="${unread != null and unread > 0}"></span>
      </a>
      <a href="/min-profil" class="avatar" aria-label="Min profil"
         th:text="${#strings.toUpperCase(#strings.substring(session.patientName, 0, 1))}">A</a>
    </div>
  </header>

  <!-- Tidslinjen genbruger .rounds-mønsteret (samme som rundehistorik), da der ikke findes en separat timeline-klasse -->
  <section class="card" aria-labelledby="tidslinje-title">
    <div class="section-head">
      <!-- overskriften viser, hvilken runde tidslinjen hører til (${round} fra TimelineController – null = ingen runde) -->
      <h2 id="tidslinje-title" th:text="${round != null} ? 'Runde ' + ${round.roundNumber} + ' · ' + ${round.treatmentType} : 'Dit forløb'">Runde 2 · IVF</h2>
      <!-- tidligere runder (også fra afsluttede forløb) vælges i rundehistorik -->
      <a href="/rundehistorik">Andre runder →</a>
    </div>
    <p class="muted" th:if="${round != null and round.endDate != null}"
       th:text="'Afsluttet runde (' + ${#temporals.format(round.startDate, 'd. MMM')} + ' – ' + ${#temporals.format(round.endDate, 'd. MMM yyyy')} + ').'">Afsluttet runde.</p>
    <p class="muted">Vigtige begivenheder i runden, i rækkefølge.</p>

    <!-- th:each: ét li per begivenhed (Event) i den runde, der er i gang. e = én begivenhed ad gangen -->
    <!-- TIDSLINJE: lodret linje med én prik per begivenhed (CSS-klassen .timeline i pages.css).
         th:classappend: is-past = er sket (udfyldt prik), is-today = i dag, ellers kommende (hul prik).
         ${today} kommer fra TimelineController; e.dateTime.toLocalDate() = kun datoen, uden klokkeslæt -->
    <ol class="timeline">
      <li th:each="e : ${events}"
          th:classappend="${e.dateTime.toLocalDate().isBefore(today)} ? 'is-past' : (${e.dateTime.toLocalDate().equals(today)} ? 'is-today' : '')">
        <span class="timeline__dot" aria-hidden="true"></span>
        <div class="timeline__body">
          <strong th:text="${e.eventType.label}">Blodprøve</strong>
          <span th:text="${#temporals.format(e.dateTime, 'd. MMMM')} + (${e.description != null} ? ' · ' + ${e.description} : '')">1. september</span>
        </div>
      </li>
    </ol>
    <p class="muted" th:if="${events.isEmpty()}">Ingen begivenheder i denne runde endnu.</p>
  </section>

</main>

</body>
</html>
