<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simpl – Log ind</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/customStyle.css">

</head>
<body>

<!-- logo til venstre, formular til højre -->
<div class="split">

    <section class="brand">
        <img src="/img/spire-ring.svg" alt="" width="104" height="104">
        <h1 class="wordmark">SIMPL</h1>
        <p class="tagline">Dit forløb, din vej</p>
        <p class="privacy">Dine data er kun dine</p>
    </section>

    <main class="form-area">
        <div class="card login-card">
            <h2>Velkommen</h2>
            <p class="subtitle">Log ind på din profil</p>

            <!-- post, så adgangskoden ikke kommer med i URL'en -->
            <form action="/login" method="post">
                <label for="username">Brugernavn</label>
                <!-- brugernavnet bliver stående efter et forkert login, så man ikke skal skrive det igen -->
                <input type="text" id="username" name="username" th:value="${username}"
                       placeholder="Dit brugernavn" autocomplete="username" required>

                <label for="password">Adgangskode</label>
                <input type="password" id="password" name="password"
                       placeholder="Din adgangskode" autocomplete="current-password" required>
                <p th:if="${fejl}" th:text="${fejl}" class="field-error" role="alert"></p>


                <button type="submit">Log ind</button>
            </form>

            <p class="link-line">
                Har du ikke en profil?
                <a href="/opretprofil">Opret profil</a>
            </p>
        </div>
    </main>

</div>

</body>
</html>
