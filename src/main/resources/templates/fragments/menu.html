<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Fragment = menuen, som er ens på alle sider. Hentes ind i en side sådan:
  <nav th:replace="~{fragments/menu :: menu('medicin')}"></nav>
  Parameteren active (ligesom en parameter i en metode) fortæller, hvilket menupunkt der skal lyse op:
  'dashboard', 'medicin', 'hormoner', 'dagbog', 'aftaler', 'tidslinje', 'dokumenter' eller 'rundehistorik'.
  Sider uden eget menupunkt (fx min-profil) sender 'ingen'.
-->
<nav class="sidenav" aria-label="Hovedmenu" th:fragment="menu(active)">
    <a class="sidenav__logo" href="/dashboard">
        <img src="/img/spire.svg" alt="" width="22" height="22">
        <span>SIMPL</span>
    </a>

    <ul class="sidenav__list">
        <!-- th:classappend: tilføj is-active, KUN hvis active er dette menupunkt. th:aria-current: skærmlæsere får at vide, hvilken side man er på
             (står der null, fjerner Thymeleaf attributten helt) -->
        <li><a href="/dashboard" th:classappend="${active == 'dashboard'} ? 'is-active'" th:aria-current="${active == 'dashboard'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/></svg>
            <span>Hjem</span></a></li>
        <li><a href="/medicin" th:classappend="${active == 'medicin'} ? 'is-active'" th:aria-current="${active == 'medicin'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8.5 12.2 2.3 2.3 4.7-4.8"/></svg>
            <span>Medicin</span></a></li>
        <li><a href="/hormoner" th:classappend="${active == 'hormoner'} ? 'is-active'" th:aria-current="${active == 'hormoner'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5.5 3.5 3L19 7"/><path d="M15 7h4v4"/></svg>
            <span>Hormoner</span></a></li>
        <li><a href="/dagbog" th:classappend="${active == 'dagbog'} ? 'is-active'" th:aria-current="${active == 'dagbog'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l1-4L16.5 4.5l2.9 2.9L8.9 18 5 19z"/></svg>
            <span>Dagbog</span></a></li>
        <!-- desktop-only = vises ikke på mobil -->
        <li class="desktop-only"><a href="/aftaler" th:classappend="${active == 'aftaler'} ? 'is-active'" th:aria-current="${active == 'aftaler'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M8 4v4M16 4v4"/></svg>
            <span>Aftaler</span></a></li>
        <li class="desktop-only"><a href="/tidslinje" th:classappend="${active == 'tidslinje'} ? 'is-active'" th:aria-current="${active == 'tidslinje'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M12 8h6a2 2 0 0 0 0-4M12 14h-5a2 2 0 0 1 0-4"/><circle cx="12" cy="19" r="1.4"/></svg>
            <span>Tidslinje</span></a></li>
        <li class="desktop-only"><a href="/dokumenter" th:classappend="${active == 'dokumenter'} ? 'is-active'" th:aria-current="${active == 'dokumenter'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg>
            <span>Dokumenter</span></a></li>
        <li><a href="/rundehistorik" th:classappend="${active == 'rundehistorik'} ? 'is-active'" th:aria-current="${active == 'rundehistorik'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>
            <span>Historik</span></a></li>
    </ul>

    <!-- nederst i menuen -->
    <p class="sidenav__footer desktop-only">
        <a href="/min-profil">Min profil</a> · <a href="/logout">Log ud</a>
    </p>
</nav>

</body>
</html>
