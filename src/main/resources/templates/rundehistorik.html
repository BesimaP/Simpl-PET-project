<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Rundehistorik</title>

  <!-- skrifttyper og vores css filer -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->

  <!-- javascript: defer = vent med at køre til hele siden er læst. common.js først, så sidens egen fil -->
  <script src="/js/common.js" defer></script>
</head>
<body class="dashboard">

<!-- menuen hentes fra fragments/menu.html – 'rundehistorik' = det menupunkt, der lyser op -->
<nav th:replace="~{fragments/menu :: menu('rundehistorik')}"></nav>

  <!-- selve siden -->
  <main class="content">

    <!-- overskrift + klokke + avatar: fælles fragment i templates/fragments/topbar.html -->
    <header th:replace="~{fragments/topbar :: topbar('Rundehistorik')}"></header>

    <!-- besked fra controlleren: "Gemt ✓" eller en fejl. Fragmentet ligger i templates/fragments/besked.html -->
    <div th:replace="~{fragments/besked :: besked}"></div>

    <!-- ét kort per forløb, nyeste først – også afsluttede forløb, så patienten kan se sine tidligere forsøg.
         th:each j : ${journeys} = ét forløb ad gangen. ${roundsPerJourney[j.id]} = runderne i netop det forløb -->
    <section class="card" th:each="j : ${journeys}">
      <div class="section-head">
        <!-- overskrift: hvornår forløbet startede, og om det er i gang eller afsluttet -->
        <h2 class="eyebrow" th:text="'Forløb startet ' + ${#temporals.format(j.startDate, 'd. MMM yyyy')} + (${j.status.name() == 'ACTIVE'} ? ' · i gang' : ' · afsluttet')">Forløb startet 1. mar 2026 · afsluttet</h2>
        <!-- aftalerne i netop dette forløb -->
        <a th:href="@{/aftaler(forloeb=${j.id})}">Aftaler →</a>
      </div>
      <!-- hver li = én runde: navn + periode, status-pil og et link til rundens tidslinje -->
      <ul class="rounds">
        <li th:each="r : ${roundsPerJourney[j.id]}">
          <div class="round__info">
            <strong th:text="'Runde ' + ${r.roundNumber} + ' · ' + ${r.treatmentType}">Runde 2 · IVF</strong>
            <!-- th:if / th:unless: endDate er null, mens runden er i gang -->
            <span th:if="${r.endDate == null}" th:text="${#temporals.format(r.startDate, 'd. MMM yyyy')} + ' – i gang'">21 aug – i gang</span>
            <span th:unless="${r.endDate == null}" th:text="${#temporals.format(r.startDate, 'd. MMM')} + ' – ' + ${#temporals.format(r.endDate, 'd. MMM yyyy')} + (${r.result != null} ? ' · ' + ${r.result.label} : '')">3 maj – 4 jun 2026 · Negativ</span>
          </div>
          <!-- pill = den lille afrundede status-boks -->
          <span class="pill" th:text="${r.status.name() == 'IN_PROGRESS'} ? 'Aktiv' : 'Afsluttet'">Aktiv</span>
          <!-- ?runde= = tidslinjen for netop denne runde (også en gammel) -->
          <a th:href="@{/tidslinje(runde=${r.id})}" aria-label="Se rundens tidslinje">→</a>
        </li>
      </ul>
      <p class="muted" th:if="${roundsPerJourney[j.id].isEmpty()}">Ingen runder i dette forløb.</p>
    </section>

    <!-- slet ingen forløb endnu -->
    <section class="card" th:if="${journeys.isEmpty()}">
      <p class="muted">Ingen forløb endnu. Start dit forløb på forsiden.</p>
    </section>

  </main>

</body>
</html>
