<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Rundehistorik</title>

  <!-- skrifttyper og vores css filer -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->

  <!-- javascript: defer = vent med at køre til hele siden er læst. common.js først, så sidens egen fil -->
  <script src="/js/common.js" defer></script>
</head>
<body class="dashboard">

<!-- menuen hentes fra fragments/menu.html – 'rundehistorik' = det menupunkt, der lyser op -->
<nav th:replace="~{fragments/menu :: menu('rundehistorik')}"></nav>

  <!-- selve siden -->
  <main class="content">

    <!-- overskrift + avatar øverst -->
    <header class="topbar">
      <div>
        <h1>Rundehistorik</h1>
      </div>
      <div class="topbar__actions">
        <a href="/notifikationer" class="iconbtn" aria-label="Notifikationer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
          <!-- th:if: rød prik ved ulæste påmindelser. ${unread} sættes for alle sider i RouteConfig (before-handler) -->
          <span class="dot" th:if="${unread != null and unread > 0}"></span>
        </a>
        <a href="/min-profil" class="avatar desktop-only" aria-label="Min profil"
           th:text="${#strings.toUpperCase(#strings.substring(session.patientName, 0, 1))}">A</a>
      </div>
    </header>

    <!-- besked fra controlleren: "Gemt ✓" eller en fejl. Fragmentet ligger i templates/fragments/besked.html -->
    <div th:replace="~{fragments/besked :: besked}"></div>

    <!-- ét kort med alle runder -->
    <section class="card">
      <h2 class="eyebrow">Dine runder</h2>
      <!-- hver li = én runde: navn + periode, status-pil og et link videre til tidslinjen -->
      <ul class="rounds">
        <!-- th:each: én runde per li. r = én runde ad gangen -->
        <li th:each="r : ${rounds}">
          <div class="round__info">
            <strong th:text="'Runde ' + ${r.roundNumber} + ' · ' + ${r.treatmentType}">Runde 2 · IVF</strong>
            <!-- th:if / th:unless: endDate er null, mens runden er i gang -->
            <span th:if="${r.endDate == null}" th:text="${#temporals.format(r.startDate, 'd. MMM yyyy')} + ' – i gang'">21 aug – i gang</span>
            <span th:unless="${r.endDate == null}" th:text="${#temporals.format(r.startDate, 'd. MMM')} + ' – ' + ${#temporals.format(r.endDate, 'd. MMM yyyy')} + (${r.result != null} ? ' · ' + ${r.result} : '')">3 maj – 4 jun 2026 · NEGATIVE</span>
          </div>
          <!-- pill = den lille afrundede status-boks -->
          <span class="pill" th:text="${r.status.name() == 'IN_PROGRESS'} ? 'Aktiv' : 'Afsluttet'">Aktiv</span>
          <a href="/tidslinje">→</a>
        </li>
      </ul>
      <p class="muted" th:if="${rounds.isEmpty()}">Ingen runder endnu.</p>
    </section>

  </main>

</body>
</html>
