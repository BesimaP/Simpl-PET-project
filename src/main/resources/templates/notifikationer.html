<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Notifikationer</title>

  <!-- skrifttyper og vores css filer (absolutte stier med / foran, fordi siden nu er en template) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->

  <!-- javascript: defer = vent med at køre til hele siden er læst -->
  <script src="/js/common.js" defer></script>
</head>
<body class="dashboard">

<!-- menuen - den er ens på alle sider -->
<nav class="sidenav" aria-label="Hovedmenu">
  <a class="sidenav__logo" href="/dashboard">
    <img src="/img/spire.svg" alt="" width="22" height="22">
    <span>SIMPL</span>
  </a>

  <ul class="sidenav__list">
    <li><a href="/dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/></svg>
      <span>Hjem</span></a></li>
    <li><a href="/medicin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8.5 12.2 2.3 2.3 4.7-4.8"/></svg>
      <span>Medicin</span></a></li>
    <li><a href="/hormoner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5.5 3.5 3L19 7"/><path d="M15 7h4v4"/></svg>
      <span>Hormoner</span></a></li>
    <li><a href="/dagbog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l1-4L16.5 4.5l2.9 2.9L8.9 18 5 19z"/></svg>
      <span>Dagbog</span></a></li>
    <!-- desktop-only = vises ikke på mobil -->
    <li class="desktop-only"><a href="/aftaler">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M8 4v4M16 4v4"/></svg>
      <span>Aftaler</span></a></li>
    <li class="desktop-only"><a href="/tidslinje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M12 8h6a2 2 0 0 0 0-4M12 14h-5a2 2 0 0 1 0-4"/><circle cx="12" cy="19" r="1.4"/></svg>
      <span>Tidslinje</span></a></li>
    <li class="desktop-only"><a href="/templates/dokumenter.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg>
      <span>Dokumenter</span></a></li>
    <li><a href="/rundehistorik">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Historik</span></a></li>
  </ul>

  <!-- nederst i menuen -->
  <p class="sidenav__footer desktop-only">
    <a href="/min-profil">Min profil</a> · <a href="/login">Log ud</a>
  </p>
</nav>

<!-- selve siden -->
<main class="content">

  <!-- overskrift + klokke og avatar øverst -->
  <header class="topbar">
    <div>
      <h1>Notifikationer</h1>
    </div>
    <div class="topbar__actions">
      <a href="/notifikationer" class="iconbtn" aria-label="Notifikationer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
      </a>
      <a href="/min-profil" class="avatar desktop-only" aria-label="Min profil">A</a>
    </div>
  </header>

  <!-- Notifikationer som .rounds-underkort, samme mønster som rundehistorik. is-read = læst (grå) -->
  <section class="card" aria-labelledby="notif-title">
    <div class="section-head">
      <h2 id="notif-title">Alle notifikationer</h2>
    </div>
    <ul class="rounds">
      <!-- th:each: én notifikation per li. th:classappend: is-read når den er læst -->
      <li th:each="n : ${notifications}" th:classappend="${n.read} ? 'is-read'">
        <div class="round__info">
          <strong th:text="${n.title}">Scanning i morgen</strong>
          <span th:text="${n.message} + ' · ' + ${#temporals.format(n.dateTime, 'd. MMM HH:mm')}">5. september kl. 9.30 · Vitanova</span>
        </div>
        <!-- ulæst: en lille formular, hvor knappen markerer som læst -> POST /notifikationer/laest -->
        <form th:unless="${n.read}" action="/notifikationer/laest" method="post">
          <input type="hidden" name="id" th:value="${n.id}">
          <button type="submit" class="pill">Ny · markér som læst</button>
        </form>
      </li>
    </ul>
    <p class="muted" th:if="${notifications.isEmpty()}">Ingen notifikationer.</p>
  </section>

</main>

</body>
</html>
