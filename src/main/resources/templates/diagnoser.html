<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Diagnoser</title>

  <!-- skrifttyper og vores css filer -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->

  <!-- javascript: defer = vent med at køre til hele siden er læst. common.js først, så sidens egen fil -->
  <script src="/js/common.js" defer></script>
  <script src="/js/diagnoser.js" defer></script>
</head>
<body class="dashboard">

<!-- menuen - den er ens på alle sider -->
<nav class="sidenav" aria-label="Hovedmenu">
  <a class="sidenav__logo" href="/dashboard">
    <img src="/img/spire.svg" alt="" width="22" height="22">
    <span>SIMPL</span>
  </a>

  <ul class="sidenav__list">
      <li><a href="/dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/></svg>
        <span>Hjem</span></a></li>
      <li><a href="/medicin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8.5 12.2 2.3 2.3 4.7-4.8"/></svg>
        <span>Medicin</span></a></li>
      <li><a href="/hormoner">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5.5 3.5 3L19 7"/><path d="M15 7h4v4"/></svg>
        <span>Hormoner</span></a></li>
      <li><a href="/dagbog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l1-4L16.5 4.5l2.9 2.9L8.9 18 5 19z"/></svg>
        <span>Dagbog</span></a></li>
      <!-- desktop-only = vises ikke på mobil -->
      <li class="desktop-only"><a href="/aftaler">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M8 4v4M16 4v4"/></svg>
        <span>Aftaler</span></a></li>
      <li class="desktop-only"><a href="/tidslinje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M12 8h6a2 2 0 0 0 0-4M12 14h-5a2 2 0 0 1 0-4"/><circle cx="12" cy="19" r="1.4"/></svg>
        <span>Tidslinje</span></a></li>
      <li class="desktop-only"><a href="/templates/dokumenter.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg>
        <span>Dokumenter</span></a></li>
      <li><a href="/rundehistorik">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Historik</span></a></li>
    </ul>

  <!-- nederst i menuen -->
  <p class="sidenav__footer desktop-only">
    <a href="/min-profil">Min profil</a> · <a href="/login">Log ud</a>
  </p>
</nav>

<!-- selve siden -->
<main class="content">

  <!-- overskrift + avatar øverst -->
  <header class="topbar">
    <div>
      <h1>Diagnoser</h1>
    </div>
    <div class="topbar__actions">
      <a href="/min-profil" class="avatar desktop-only" aria-label="Min profil">A</a>
    </div>
  </header>

  <!-- form-layout gør at kortene står i 2 kolonner -->
  <div class="form-layout">

    <!-- VENSTRE: formular -->
    <section class="card form-card" aria-labelledby="diagnosis-title">
      <h2 id="diagnosis-title">Ny diagnose</h2>
      <p class="subtitle">Som klinikken har skrevet det.</p>

      <!-- action = siden sender bare til sig selv indtil vi får backend på -->
      <form action="/diagnoser" method="post">
        <!-- for og id skal være ens, så label og felt hører sammen -->
        <label for="diagnosis">Diagnose</label>
        <input type="text" id="diagnosis" name="diagnosis" placeholder="Fx PCOS" required>

        <!-- textarea = stort tekstfelt. ingen required = beskrivelsen er valgfri -->
        <label for="description">Beskrivelse <span class="optional">(valgfrit)</span></label>
        <textarea id="description" name="description" rows="4" placeholder="Hvad har klinikken sagt?"></textarea>

        <!-- knappen sender formularen -->
        <button type="submit">Gem diagnose</button>
      </form>

      <p class="link-line"><a href="/min-profil">Annullér</a></p>
    </section>

    <!-- HØJRE: patientens registrerede diagnoser -->
    <aside class="card helpbox" aria-labelledby="list-title">
      <h2 id="list-title" class="eyebrow">Dine diagnoser</h2>
      <!-- samme liste-css som dagbogen, så det ser ens ud -->
      <ul class="notes">
        <!-- th:each: ét li per diagnose i listen. d = én diagnose ad gangen -->
        <li th:each="d : ${diagnoses}">
          <strong th:text="${d.name}">PCOS</strong>
          <span th:if="${d.description}" th:text="${d.description}">beskrivelse</span>
        </li>
      </ul>
      <p class="muted">
        <span th:text="${diagnoses.size()}">2</span>
        <span th:text="${diagnoses.size() == 1} ? 'diagnose' : 'diagnoser'">diagnoser</span> registreret.
      </p>
    </aside>

  </div>

</main>

</body>
</html>
