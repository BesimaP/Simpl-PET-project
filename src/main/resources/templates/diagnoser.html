<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Diagnoser</title>

  <!-- skrifttyper og vores css filer -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->

  <!-- javascript: defer = vent med at køre til hele siden er læst. common.js først, så sidens egen fil -->
  <script src="/js/common.js" defer></script>
  <script src="/js/diagnoser.js" defer></script>
</head>
<body class="dashboard">

<!-- menuen hentes fra fragments/menu.html – 'ingen' = det menupunkt, der lyser op -->
<nav th:replace="~{fragments/menu :: menu('ingen')}"></nav>

<!-- selve siden -->
<main class="content">

  <!-- overskrift + avatar øverst -->
  <header class="topbar">
    <div>
      <h1>Diagnoser</h1>
    </div>
    <div class="topbar__actions">
      <a href="/notifikationer" class="iconbtn" aria-label="Notifikationer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <!-- th:if: rød prik ved ulæste påmindelser. ${unread} sættes for alle sider i RouteConfig (before-handler) -->
        <span class="dot" th:if="${unread != null and unread > 0}"></span>
      </a>
      <a href="/min-profil" class="avatar" aria-label="Min profil"
         th:text="${#strings.toUpperCase(#strings.substring(session.patientName, 0, 1))}">A</a>
    </div>
  </header>

  <!-- besked fra controlleren: "Gemt ✓" eller en fejl. Fragmentet ligger i templates/fragments/besked.html -->
  <div th:replace="~{fragments/besked :: besked}"></div>

  <!-- form-layout gør at kortene står i 2 kolonner -->
  <div class="form-layout">

    <!-- VENSTRE: formular -->
    <section class="card form-card" aria-labelledby="diagnosis-title">
      <h2 id="diagnosis-title">Ny diagnose</h2>
      <p class="subtitle">Som klinikken har skrevet det.</p>

      <!-- action = siden sender bare til sig selv indtil vi får backend på -->
      <form action="/diagnoser" method="post">
        <!-- for og id skal være ens, så label og felt hører sammen -->
        <label for="diagnosis">Diagnose</label>
        <input type="text" id="diagnosis" name="diagnosis" placeholder="Fx PCOS" required>

        <!-- textarea = stort tekstfelt. ingen required = beskrivelsen er valgfri -->
        <label for="description">Beskrivelse <span class="optional">(valgfrit)</span></label>
        <textarea id="description" name="description" rows="4" placeholder="Hvad har klinikken sagt?"></textarea>

        <!-- knappen sender formularen -->
        <button type="submit">Gem diagnose</button>
      </form>

      <p class="link-line"><a href="/min-profil">Annullér</a></p>
    </section>

    <!-- HØJRE: patientens registrerede diagnoser -->
    <aside class="card helpbox" aria-labelledby="list-title">
      <h2 id="list-title" class="eyebrow">Dine diagnoser</h2>
      <!-- samme liste-css som dagbogen, så det ser ens ud -->
      <ul class="notes">
        <!-- th:each: ét li per diagnose i listen. d = én diagnose ad gangen -->
        <li th:each="d : ${diagnoses}">
          <strong th:text="${d.name}">PCOS</strong>
          <span th:if="${d.description}" th:text="${d.description}">beskrivelse</span>
        </li>
      </ul>
      <p class="muted">
        <span th:text="${diagnoses.size()}">2</span>
        <span th:text="${diagnoses.size() == 1} ? 'diagnose' : 'diagnoser'">diagnoser</span> registreret.
      </p>
    </aside>

  </div>

</main>

</body>
</html>
