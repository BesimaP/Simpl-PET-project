<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpl – Min profil</title>

  <!-- skrifttyper og vores css filer -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">     <!-- farver og skrifttyper -->
  <link rel="stylesheet" href="/css/base.css">       <!-- css til alle sider -->
  <link rel="stylesheet" href="/css/layout.css">     <!-- menu, topbar, sidens ramme -->
  <link rel="stylesheet" href="/css/components.css"> <!-- knapper, kort, lister, pop-op -->
  <link rel="stylesheet" href="/css/pages.css">      <!-- det der er specielt for denne side -->

  <!-- javascript: defer = vent med at køre til hele siden er læst. min-profil.js = kodeord-tjek + slet-dialog -->
  <script src="/js/common.js" defer></script>
  <script src="/js/min-profil.js" defer></script>
</head>
<body class="dashboard">

<!-- menuen hentes fra fragments/menu.html – 'ingen' = det menupunkt, der lyser op -->
<nav th:replace="~{fragments/menu :: menu('ingen')}"></nav>

<!-- selve siden -->
<main class="content">

  <!-- overskrift + klokke og avatar øverst -->
  <header class="topbar">
    <div>
      <h1>Min profil</h1>
    </div>
    <div class="topbar__actions">
      <a href="/notifikationer" class="iconbtn" aria-label="Notifikationer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <!-- th:if: rød prik ved ulæste påmindelser. ${unread} sættes for alle sider i RouteConfig (before-handler) -->
        <span class="dot" th:if="${unread != null and unread > 0}"></span>
      </a>
      <!-- th:text: første bogstav i patientens navn -->
      <a href="/min-profil" class="avatar" aria-label="Min profil" th:text="${#strings.substring(patient.name, 0, 1)}">A</a>
    </div>
  </header>

  <!-- besked fra controlleren: "Gemt ✓" eller en fejl. Fragmentet ligger i templates/fragments/besked.html -->
  <div th:replace="~{fragments/besked :: besked}"></div>

  <!-- form-layout gør at kortene står i 2 kolonner -->
  <div class="form-layout">

    <!-- kort 1: ret sine oplysninger -->
    <section class="card">
      <h2 class="eyebrow">Profil</h2>
      <form action="/min-profil" method="post">
        <!-- th:value: felterne er forudfyldt med det nuværende navn fra databasen -->
        <label for="firstName">Fornavn</label>
        <input type="text" id="firstName" name="firstName" th:value="${patient.firstName}" placeholder="Dit fornavn" autocomplete="given-name" maxlength="50" required>

        <label for="lastName">Efternavn</label>
        <input type="text" id="lastName" name="lastName" th:value="${patient.lastName}" placeholder="Dit efternavn" autocomplete="family-name" maxlength="50" required>

        <!-- fødselsdato kan rettes (US6b AC1) – ProfileService.updateProfile tjekker, at datoen er gyldig og ikke i fremtiden -->
        <label for="dateOfBirth">Fødselsdato</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" th:value="${patient.dateOfBirth}" required>

        <!-- knappen sender formularen -->
        <button type="submit">Gem ændringer</button>
      </form>

      <!-- diagnoser hører til profilen, så de har deres egen side herfra -->
      <p class="muted centered"><a href="/diagnoser">Mine diagnoser →</a></p>
      <!-- Dokumenter er skjult i menuen på mobil, så de kan også nås herfra -->
      <p class="muted centered"><a href="/dokumenter">Mine dokumenter →</a></p>
    </section>

    <!-- kort 2: skift adgangskode -->
    <section class="card">
      <h2 class="eyebrow">Adgangskode</h2>
      <form action="/skift-kodeord" method="post">
        <!-- type password = der kommer prikker når man skriver -->
        <label for="current-password">Nuværende adgangskode</label>
        <input type="password" id="current-password" name="current-password" autocomplete="current-password" required>

        <!-- minlength 8 = koden skal være mindst 8 tegn -->
        <label for="new-password">Ny adgangskode</label>
        <input type="password" id="new-password" name="new-password" autocomplete="new-password" placeholder="Mindst 8 tegn" required minlength="8">

        <label for="repeat-password">Gentag ny adgangskode</label>
        <input type="password" id="repeat-password" name="repeat-password" autocomplete="new-password" required>
        <p id="password-error" class="field-error"></p>   <!-- tom; js/min-profil.js skriver en fejl herind, hvis koderne ikke er ens -->

        <button type="submit">Skift adgangskode</button>
      </form>
    </section>

    <!-- kort 3: log ud og slet konto -->
    <section class="card">
      <h2 class="eyebrow">Konto</h2>
      <!-- th:text: navnet fra databasen -->
      <p class="muted">Du er logget ind som <span th:text="${patient.name}">Anna</span>.</p>

      <!-- et link der ligner en knap -->
      <a href="/logout" class="btn-primary">Log ud</a>

      <!-- slet konto er med vilje lille, så man ikke trykker ved en fejl -->
      <!-- link til bekræft-siden /slet-konto (virker uden JavaScript). Med JavaScript åbner js/min-profil.js dialogen i stedet -->
      <p class="muted centered"><a href="/slet-konto" id="delete-account">Slet konto</a></p>
    </section>

  </div>

</main>

<!-- Bekræftelse før sletning (Nielsen #5: forebyg fejl). Skjult indtil js/min-profil.js åbner den.
     Uden JavaScript bruges bekræft-siden /slet-konto (templates/bekraeft.html) i stedet -->
<dialog id="confirm-delete" class="confirm">
  <!-- method dialog = knapperne lukker bare vinduet, sender ikke noget. Slet-knappen sender til serveren via formaction -->
  <form method="dialog">
    <h2>Slet din konto?</h2>
    <p class="muted">Alle dine data – forløb, runder, noter og dokumenter – slettes og kan ikke gendannes.</p>
    <div class="confirm__actions">
      <button type="submit" value="cancel" class="btn btn--outline">Annullér</button>
      <button type="submit" value="confirm" formmethod="post" formaction="/slet-konto" class="btn btn--primary">Slet konto</button>
    </div>
  </form>
</dialog>

</body>
</html>
