<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simpl – Log ind</title>

    <!-- skrifttyper og vores css filer -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/customStyle.css">

    <!-- javascript: defer = vent med at køre til hele siden er læst. common.js først, så sidens egen fil -->
    <script src="js/common.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>

<!-- split = siden er delt i to: brand til venstre, formular til højre -->
<div class="split">

    <!-- venstre side: logo og slogan -->
    <section class="brand">
        <img src="img/spire-ring.svg" alt="" width="104" height="104">
        <h1 class="wordmark">SIMPL</h1>
        <p class="tagline">Dit forløb, din vej</p>
        <p class="privacy">Dine data er kun dine</p>
    </section>

    <!-- højre side: selve login-kortet -->
    <main class="form-area">
        <div class="card login-card">
            <h2>Velkommen</h2>
            <p class="subtitle">Log ind på din profil</p>

            <!-- action = hvor formularen sendes hen, method=get = data ses i adressen -->
            <form action="login.html" method="get">
                <!-- for og id skal være ens, så label og felt hører sammen -->
                <label for="username">Brugernavn</label>
                <input type="text" id="username" name="username"
                       placeholder="Dit brugernavn" autocomplete="username" required>

                <!-- type password = der kommer prikker når man skriver -->
                <label for="password">Adgangskode</label>
                <input type="password" id="password" name="password"
                       placeholder="Din adgangskode" autocomplete="current-password" required>
                <p id="login-error" class="field-error"></p>   <!-- tom; js/login.js skriver en fejl herind -->

                <!-- knappen sender formularen -->
                <button type="submit">Log ind</button>
            </form>

            <!-- link til opret profil, hvis man ikke har en -->
            <p class="link-line">
                Har du ikke en profil?
                <a href="opretprofil.html">Opret profil</a>
            </p>
        </div>
    </main>

</div>

</body>
</html>
